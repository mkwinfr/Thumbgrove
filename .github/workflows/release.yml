name: Release

on:
  push:
    tags:
      - 'v*'
  # Publishes the version in package.json, in case a tag push doesn't start a run.
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      # The uploads run side by side, and each would create its own release if none exists yet.
      - name: Create the release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          gh release view "v$version" > /dev/null 2>&1 || gh release create "v$version" --title "Thumb Grove $version" --generate-notes --target "$GITHUB_SHA"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - run: npm run dist -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
